name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: bash -n syntax check
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "::group::bash -n $f"
            bash -n "$f"
            echo "::endgroup::"
          done

      - name: shellcheck
        run: |
          shellcheck --severity=warning $(git ls-files '*.sh')

  python:
    name: Python lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --upgrade ruff

      - name: py_compile syntax check
        run: |
          for f in $(git ls-files '*.py'); do
            echo "::group::py_compile $f"
            python -m py_compile "$f"
            echo "::endgroup::"
          done

      - name: ruff lint
        run: ruff check --output-format=github .
